<svg xmlns="http://www.w3.org/2000/svg" width="900" height="24" viewBox="0 0 900 24">
  <style>
    .base { stroke: #D4AF37; stroke-opacity: 0.35; stroke-width: 1; }
    .pulse { stroke: #00FF41; stroke-width: 2; stroke-dasharray: 120 780; animation: run 3s linear infinite; }
    @keyframes run { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
    .dot { fill: #D4AF37; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
  <line class="base" x1="0" y1="12" x2="900" y2="12"/>
  <line class="pulse" x1="0" y1="12" x2="900" y2="12"/>
  <circle class="dot" cx="450" cy="12" r="4"/>
</svg>
